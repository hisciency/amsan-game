<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>반짝반짝 10연속 암산 도전</title><style>:root{font-family:system-ui,'Apple SD Gothic Neo',sans-serif;color:#27314f}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:linear-gradient(145deg,#fff2d8,#e9e7ff);display:grid;place-items:center;padding:18px}.app{width:min(100%,540px);background:white;border-radius:28px;padding:25px;box-shadow:0 15px 45px #60609024;text-align:center}h1{font-size:clamp(24px,6vw,35px);margin:12px 0}p{color:#68708c}.pill{display:inline-block;background:#f0edff;color:#6755be;padding:8px 13px;border-radius:30px;font-weight:700}.settings{display:grid;gap:13px;text-align:left;margin:22px 0}.settings label{font-weight:700}.settings input,.settings select{width:100%;padding:13px;border:2px solid #e1e3f0;border-radius:13px;font:inherit;margin-top:6px}button{cursor:pointer;border:0;border-radius:16px;background:#6958e8;color:white;padding:14px 18px;font-size:18px;font-weight:800;touch-action:manipulation}button:active{transform:scale(.97)}.secondary{background:#f0edff;color:#5b4ac8}.wide{width:100%}.hidden{display:none!important}.top{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:14px}.bar{height:12px;background:#eeedfa;border-radius:20px;overflow:hidden;margin:16px 0}.fill{height:100%;width:0;background:#6d5ce9;transition:width .2s}.question{font-size:clamp(42px,12vw,70px);font-weight:900;margin:24px 0 15px}.timer{font-size:24px;font-weight:800;color:#e57e46}.timerbar{height:8px;background:#f6e7df;border-radius:12px;overflow:hidden}.timerfill{height:100%;background:#f09b5a;width:100%}.answers{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:24px 0}.answers button{background:#f2efff;color:#4435a6;min-height:75px;font-size:29px}.answers button:hover{background:#e4dfff}.message{min-height:27px;font-weight:700;color:#e46e62}.resultIcon{font-size:76px;margin:15px}.actions{display:grid;gap:10px;margin-top:20px}.small{font-size:13px;color:#8389a0}.records{margin-top:20px;text-align:left;border-top:1px solid #e8e8f1;padding-top:18px}.records h2{font-size:21px;margin:5px 0 12px}.filters{display:grid;grid-template-columns:1fr 1fr;gap:9px}.filters input,.filters select{width:100%;padding:10px;border:1px solid #dcddeb;border-radius:10px;font:inherit;min-width:0}.statgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin:13px 0}.stat{background:#f5f2ff;border-radius:12px;padding:10px 5px;text-align:center;font-size:12px}.stat strong{display:block;font-size:19px;color:#5140c1}.recordlist{max-height:340px;overflow:auto}.record{border-bottom:1px solid #eee;padding:10px 2px;font-size:13px;line-height:1.6}.record b{color:#4638a8}.muted{color:#747a90}.recordbuttons{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.recordbuttons button{font-size:13px;padding:10px}.best{background:#fff7e4;border-radius:14px;padding:12px;margin:12px 0;font-size:14px;line-height:1.7}#resultRecord{white-space:pre-line;background:#f5f2ff;border-radius:13px;padding:12px;font-size:14px}.smallnote{font-size:12px;color:#777d91;line-height:1.5}@media(max-width:380px){.app{padding:17px}.statgrid{gap:4px}.stat strong{font-size:16px}} </style></head><body><main class="app"><section id="home"><div class="pill">🌟 집에서 즐기는 두뇌 운동</div><h1>10연속 암산 도전!</h1><p>문제를 10개 연속으로 맞히면 성공!<br>틀리거나 시간이 끝나면 다시 도전해요.</p><div class="settings"><label>도전자 이름<input id="name" maxlength="14" placeholder="예: 반짝이" value="반짝이"></label><label>문제 난이도<select id="level"><option value="easy">1단계 · 10 이하 덧셈·뺄셈</option><option value="normal" selected>2단계 · 20 이하 덧셈·뺄셈</option><option value="hard">3단계 · 100 이하 덧셈·뺄셈</option><option value="mix">4단계 · 구구단 포함</option></select></label><label>문제당 제한 시간<select id="seconds"><option value="0">시간 제한 없음</option><option value="15" selected>15초 · 차근차근</option><option value="10">10초 · 집중!</option><option value="5">5초 · 빠르게!</option><option value="2">2초 · 번개 도전!</option></select></label></div><button class="wide" id="start">🚀 도전 시작!</button><p class="small">휴대폰 · 태블릿 · 컴퓨터에서 모두 플레이할 수 있어요.</p><div class="records"><h2>📒 나의 암산 연습장</h2><div class="filters"><label>이름별 보기<select id="filterName"><option value="">전체 이름</option></select></label><label>날짜별 보기<input type="date" id="filterDate" aria-label="연습 날짜"></label></div><div class="statgrid"><div class="stat">도전 횟수<strong id="statAttempts">0</strong></div><div class="stat">성공 횟수<strong id="statWins">0</strong></div><div class="stat">최다 연속 정답<strong id="statStreak">0</strong></div></div><div class="best" id="bestInfo">아직 기록이 없어요. 첫 도전을 시작해 보세요!</div><div class="recordlist" id="recordList"></div><div class="recordbuttons"><button class="secondary" id="clearDate">날짜 필터 해제</button><button class="secondary" id="exportCsv">📥 기록 CSV 저장</button></div><p class="smallnote">기록은 이 브라우저에만 저장돼요. 브라우저 데이터를 지우거나 다른 기기를 사용하면 보이지 않을 수 있으니 가끔 CSV로 백업해 주세요.</p></div></section><section id="game" class="hidden"><div class="top"><span id="who" class="pill"></span><span id="round"></span><button class="secondary" style="font-size:13px;padding:8px" id="quit">처음으로</button></div><div class="bar"><div id="progress" class="fill"></div></div><div id="clock" class="timer"></div><div class="timerbar"><div id="timefill" class="timerfill"></div></div><div id="question" class="question"></div><div id="answers" class="answers"></div><div id="message" class="message" aria-live="polite"></div></section><section id="result" class="hidden"><div id="resultIcon" class="resultIcon"></div><h1 id="resultTitle"></h1><p id="resultText"></p><div id="resultRecord"></div><div class="actions"><button id="again">🔄 같은 설정으로 다시 도전</button><button id="next" class="secondary">⬆️ 다음 단계 도전</button><button id="change" class="secondary">⚙️ 설정 바꾸기</button></div></section></main><script>const $=id=>document.getElementById(id);let count=0,round=0,answer=0,timer=null,startAt=0,duration=0,locked=false,challengeStart=0,player="",currentLevel="",currentSeconds=0,questionToken=0;const STORE="spark_math_attempts_v2";let records=loadRecords();function loadRecords(){try{const v=JSON.parse(localStorage.getItem(STORE)||"[]");return Array.isArray(v)?v:[]}catch(e){return []}}function saveRecords(){try{localStorage.setItem(STORE,JSON.stringify(records));return true}catch(e){return false}}const levelNames={easy:"1단계",normal:"2단계",hard:"3단계",mix:"4단계"};function formatSec(ms){return (ms/1000).toFixed(1)+"초"}function dateLocal(d){return [d.getFullYear(),String(d.getMonth()+1).padStart(2,"0"),String(d.getDate()).padStart(2,"0")].join("-")}function timeLocal(d){return String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0")}const rand=(a,b)=>Math.floor(Math.random()*(b-a+1))+a;function screen(s){['home','game','result'].forEach(x=>$(x).classList.toggle('hidden',x!==s))}function stop(){if(timer){clearInterval(timer);timer=null}}function makeProblem(){const token=++questionToken;let level=$('level').value,a,b,op,max=level==='easy'?10:level==='normal'?20:100;if(level==='mix'&&Math.random()<.45){a=rand(2,9);b=rand(2,9);op='×';answer=a*b}else{op=Math.random()<.5?'+':'−';if(op==='+'){a=rand(0,max);b=rand(0,max-a);answer=a+b}else{a=rand(0,max);b=rand(0,a);answer=a-b}}$('question').textContent=`${a} ${op} ${b} = ?`;let opts=new Set([answer]);let delta=max<=20?8:20;while(opts.size<4){let n=answer+rand(-delta,delta);if(n>=0&&n!==answer)opts.add(n)}let choices=[...opts].sort(()=>Math.random()-.5);$('answers').replaceChildren(...choices.map(n=>{let btn=document.createElement('button');btn.textContent=n;btn.onclick=()=>choose(n);return btn}));$('round').textContent=`도전 ${round}회차 · ${count+1}/10`;duration=Number($('seconds').value)*1000;$('clock').textContent=duration?`${duration/1000}초`:'천천히 풀어봐요 🧡';$('timefill').style.width='100%';startAt=performance.now();if(duration){timer=setInterval(()=>{let left=Math.max(0,duration-(performance.now()-startAt));$('clock').textContent=`⏱ ${(left/1000).toFixed(1)}초`;$('timefill').style.width=`${left/duration*100}%`;if(left<=0&&token===questionToken&&!locked)finish(false,'시간이 끝났어요!')},50)}}function choose(n){if(locked)return;if(duration&&performance.now()-startAt>=duration){finish(false,'시간이 끝났어요!');return}stop();locked=true;if(n!==answer){finish(false,`정답은 ${answer}이에요.`);return}count++;$('progress').style.width=`${count*10}%`;if(count===10){finish(true,'10문제 연속 정답!');return}$('message').textContent=['멋져요! 🌈','정답! ⭐','잘하고 있어요! 🎉'][rand(0,2)];setTimeout(()=>{if($('game').classList.contains('hidden'))return;locked=false;$('message').textContent='';makeProblem()},430)}function finish(win,msg){if($('game').classList.contains('hidden'))return;stop();locked=true;questionToken++;const elapsed=Math.max(0,Math.round(performance.now()-challengeStart));const now=new Date();const item={id:Date.now()+"-"+Math.random().toString(36).slice(2,8),date:dateLocal(now),time:timeLocal(now),name:player,level:currentLevel,seconds:currentSeconds,streak:count,win:win,elapsed:elapsed};records.push(item);const saved=saveRecords();screen('result');$('resultIcon').textContent=win?'🏆':'💪';$('resultTitle').textContent=win?'10연속 성공!':'다시 도전해봐요!';$('resultText').textContent=`${player} · ${count}문제 연속 정답\n${msg}`;$('resultText').style.whiteSpace='pre-line';const same=records.filter(r=>r.name===player&&r.level===currentLevel&&Number(r.seconds)===currentSeconds);const maxStreak=Math.max(...same.map(r=>Number(r.streak)||0));const wins=same.filter(r=>r.win);const bestTime=wins.length?Math.min(...wins.map(r=>r.elapsed)):null;$('resultRecord').textContent=`📒 이번 도전: ${formatSec(elapsed)} / ${count}문제 연속 정답\n🏅 이 설정의 최고 연속 정답: ${maxStreak}개${bestTime!==null?'\n⚡ 10문제 성공 최단 시간: '+formatSec(bestTime):''}${saved?'':'\n⚠️ 브라우저 저장이 차단되어 기록이 유지되지 않을 수 있어요.'}`;$('next').classList.toggle('hidden',!win||$('level').selectedIndex===$('level').options.length-1);renderRecords()}function begin(){stop();questionToken++;round++;count=0;locked=false;player=$('name').value.trim()||'도전자';currentLevel=$('level').value;currentSeconds=Number($('seconds').value);challengeStart=performance.now();$('progress').style.width='0%';$('who').textContent=player+' 🌟';$('message').textContent='';screen('game');makeProblem()}function renderRecords(){const names=[...new Set(records.map(r=>r.name))].sort((a,b)=>a.localeCompare(b,'ko'));const selected=$('filterName').value;$('filterName').replaceChildren(new Option('전체 이름',''),...names.map(n=>new Option(n,n)));$('filterName').value=names.includes(selected)?selected:'';const name=$('filterName').value,date=$('filterDate').value;const rows=records.filter(r=>(!name||r.name===name)&&(!date||r.date===date));$('statAttempts').textContent=rows.length;$('statWins').textContent=rows.filter(r=>r.win).length;$('statStreak').textContent=rows.length?Math.max(...rows.map(r=>Number(r.streak)||0)):0;const best=rows.filter(r=>r.win).sort((a,b)=>a.elapsed-b.elapsed)[0];$('bestInfo').textContent=best?`🏆 선택한 기록 중 10문제 성공 최단 시간: ${formatSec(best.elapsed)}\n${best.name} · ${levelNames[best.level]||best.level} · ${best.seconds?best.seconds+'초 제한':'시간 제한 없음'} · ${best.date}`:'🏅 선택한 기록에서 아직 10문제 성공 기록이 없어요.';$('bestInfo').style.whiteSpace='pre-line';const list=$('recordList');list.replaceChildren();if(!rows.length){const p=document.createElement('p');p.className='muted';p.textContent='해당하는 연습 기록이 없어요.';list.append(p);return}rows.slice().reverse().slice(0,100).forEach(r=>{const div=document.createElement('div');div.className='record';const strong=document.createElement('b');strong.textContent=(r.win?'🏆 성공':'💪 도전')+' · '+r.name;const detail=document.createElement('div');detail.className='muted';detail.textContent=`${r.date} ${r.time} · ${levelNames[r.level]||r.level} · ${r.seconds?r.seconds+'초 제한':'시간 제한 없음'} · ${r.streak}/10 정답 · ${formatSec(r.elapsed)}`;div.append(strong,detail);list.append(div)});if(rows.length>100){const p=document.createElement('p');p.className='smallnote';p.textContent='최근 100건만 표시합니다. CSV에는 전체 기록이 포함돼요.';list.append(p)}}function exportCsv(){const headers=['날짜','시간','이름','단계','문제당 제한 시간(초, 0=무제한)','연속 정답 수','10문제 성공','총 소요 시간(초)'];const lines=[headers,...records.map(r=>[r.date,r.time,r.name,levelNames[r.level]||r.level,r.seconds,r.streak,r.win?'성공':'실패',(r.elapsed/1000).toFixed(1)])];const csv='\ufeff'+lines.map(row=>row.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(',')).join('\r\n');const url=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8;'}));const a=document.createElement('a');a.href=url;a.download='암산연습기록_'+dateLocal(new Date())+'.csv';document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000)}
$('start').onclick=()=>{round=0;begin()};$('again').onclick=begin;$('change').onclick=()=>{stop();renderRecords();screen('home')};$('quit').onclick=()=>{stop();questionToken++;locked=true;renderRecords();screen('home')};$('next').onclick=()=>{$('level').selectedIndex=Math.min($('level').selectedIndex+1,$('level').options.length-1);round=0;begin()};$('filterName').onchange=renderRecords;$('filterDate').onchange=renderRecords;$('clearDate').onclick=()=>{$('filterDate').value='';renderRecords()};$('exportCsv').onclick=exportCsv;renderRecords();</script></body></html>
